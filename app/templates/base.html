<!DOCTYPE html>
<html lang="en">
    <head>
        <title>AthleteOps</title>
        <link rel="stylesheet" href="{{ url_for('static', path='main.css') }}">
    </head>
     <body class="app">
        <header>
            <h1><a href="/dashboard" style="text-decoration: none; color: inherit;">AthleteOps</a></h1>
        </header>
        <main class="dashboard-grid">
            {% block content %}{% endblock %}
        </main>
        <footer style="text-align: center; margin-top: 2rem; padding: 1rem;">
            <form method="post" action="/auth/logout/form" style="display: inline;">
                <button type="submit" style="padding: 0.5rem 1rem; border-radius: 0.5rem; background-color: #dc2626; color: white; border: none; cursor: pointer; font-size: 0.875rem;">
                    Logout
                </button>
            </form>
        </footer>
    </body>
</html>
