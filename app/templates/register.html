{% extends "base.html" %}

{% block content %}
  <div style="max-width: 400px; margin: 0 auto; padding: 2rem; display: flex; flex-direction: column; justify-content: center; min-height: 60vh; grid-column: 2;">
    <h2 style="text-align: center; margin-bottom: 2rem;">Register</h2>
    
    {% if error %}
      <div style="background-color: #dc2626; color: white; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem;">
        {{ error }}
      </div>
    {% endif %}
    
    <form method="post" action="/auth/register/form" style="display: flex; flex-direction: column; gap: 1rem;">
      <input 
        type="text" 
        name="first_name" 
        placeholder="First Name" 
        required
        style="padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background-color: #1e293b; color: white;"
      >
      <input 
        type="text" 
        name="last_name" 
        placeholder="Last Name" 
        required
        style="padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background-color: #1e293b; color: white;"
      >
      <input 
        type="email" 
        name="email" 
        placeholder="Email" 
        required
        style="padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background-color: #1e293b; color: white;"
      >
      <input 
        type="password" 
        name="password" 
        placeholder="Password" 
        required
        style="padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background-color: #1e293b; color: white;"
      >
      <button 
        type="submit"
        style="padding: 0.75rem; border-radius: 0.5rem; background-color: #3b82f6; color: white; border: none; cursor: pointer; font-weight: 600;"
      >
        Register
      </button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem; color: #94a3b8;">
      Already have an account? 
      <a href="/auth/login" style="color: #3b82f6; text-decoration: none;">Login here</a>
    </p>
  </div>
{% endblock %}
